name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── CLI: lint, build, test ────────────────────────────────────────────────
  cli:
    name: CLI (build + test)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build --workspace=packages/cli

      - name: Run tests
        run: npm run test --workspace=packages/cli

      - name: Verify CLI binary runs
        run: |
          cd packages/cli
          node dist/cli.js --version

  # ─── Web: type-check + build ───────────────────────────────────────────────
  web:
    name: Web UI (type-check + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check web
        run: npx tsc --noEmit --project packages/web/tsconfig.json

      - name: Build web
        run: npm run build --workspace=packages/web
        env:
          # Prevent Next.js telemetry during CI
          NEXT_TELEMETRY_DISABLED: 1

  # ─── Lint (runs after both jobs pass) ─────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [cli, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=packages/web
        continue-on-error: true
