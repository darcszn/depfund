name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ─── CLI: build + test ─────────────────────────────────────────────────────
  cli:
    name: CLI (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install CLI dependencies
        run: npm install
        working-directory: packages/cli

      - name: Build CLI
        run: npm run build
        working-directory: packages/cli

      - name: Run tests
        run: npm test
        working-directory: packages/cli

      - name: Verify CLI binary
        run: node dist/cli.js --version
        working-directory: packages/cli

  # ─── Web: install + build ──────────────────────────────────────────────────
  web:
    name: Web UI (build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install web dependencies
        run: npm install
        working-directory: packages/web

      - name: Build web
        run: npm run build
        working-directory: packages/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
